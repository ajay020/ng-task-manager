<div class="max-w-9/10 bg-gray-200 mt-4 mx-auto p-4">
  <h1 class="text-center text-2xl mb-4">Task Manager</h1>

  @if (loading()) {
    <p>Loading tasks...</p>
  }@else if (error()) {
    <p>{{error()}}</p>
  }
  @else {
    <app-task-form (taskSubmit)="onTaskAdd($event)" />

    <app-task-list
      [tasks]="tasks()"
      (editTask)="onEditTask($event)"
      (taskChange)="handleChange($event)"
      (taskDelete)="deleteTask($event)"
    />
  }
</div>
