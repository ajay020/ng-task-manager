<div class="max-w-3/4 bg-gray-200 mt-4 mx-auto p-2">
  <h1 class="text-center text-2xl my-4">Task Manager</h1>

  @if (loading()) {
    <p>Loading tasks...</p>
  }@else if (error()) {
    <p>{{error()}}</p>
  }
  @else {
    <app-task-form (taskSubmit)="onTaskAdd($event)" />

    <app-task-list
      [tasks]="tasks()"
      (editTask)="onEditTask($event)"
      (taskChange)="handleChange($event)"
      (taskDelete)="deleteTask($event)"
    />
  }
</div>
